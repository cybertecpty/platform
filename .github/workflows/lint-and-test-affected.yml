name: Lint and Test Affected

on:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  actions: read
  contents: read
  # The coverage step upserts a single PR comment (skipped on forks, which get a
  # read-only token anyway).
  pull-requests: write

env:
  # Read-write CI token for the Nx Cloud remote cache. Set the repo secret
  # NX_CLOUD_ACCESS_TOKEN to the "protected-branch-pipeline" token from
  # https://cloud.nx.app. Empty until then — CI still runs, just without shared
  # caching. If fork PRs ever land, switch this to a conditional that hands forks
  # the read-only token instead.
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

# Supersede stale runs on a PR (saves Nx Cloud agent time). Push runs on
# develop/main always finish: nrwl/nx-set-shas bases `$NX_BASE` on the last
# successful commit, and each commit there keeps a completed result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      # pnpm must be on PATH before setup-node so its cache logic can find the
      # store. Version comes from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Unit-test the CI-only coverage reporter and the Claude Code hooks (plain
      # Node, not Nx projects). `pnpm verify` runs the same step locally.
      - run: node --test .github/scripts/*.test.cjs .claude/hooks/*.test.cjs

      # Derive the diff base/head for format:check and `nx affected`:
      # on a PR, the merge-base with the target branch; on a push, the last
      # successful commit on this branch. Exposes $NX_BASE / $NX_HEAD. Needs
      # `actions: read` + `fetch-depth: 0` (both set above).
      - uses: nrwl/nx-set-shas@v5

      # Enable Nx Cloud task distribution. Runs after install because it is
      # invoked through the workspace's pinned Nx (pnpm exec).
      # Learn more at https://nx.dev/docs/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: pnpm exec nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e,lighthouse"

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      # $NX_BASE / $NX_HEAD come from nrwl/nx-set-shas above.
      - run: pnpm exec nx record -- pnpm exec nx format:check --base=$NX_BASE --head=$NX_HEAD
      # `lighthouse` is the cybertec-io-e2e performance/accessibility gate;
      # `e2e` also runs the axe check.
      # A PR runs only the projects it affects. A push to develop/main runs every
      # project: a safety net for changes the project graph doesn't connect to a
      # project, and a complete workspace coverage number (ADR 0007, 2026-10-16).
      - if: github.event_name == 'pull_request'
        run: pnpm exec nx affected -t lint test build typecheck e2e lighthouse --base=$NX_BASE --head=$NX_HEAD
      - if: github.event_name != 'pull_request'
        run: pnpm exec nx run-many -t lint test build typecheck e2e lighthouse

      # Coverage reporting (ADR 0007 amendment / issue #52). The `test` targets
      # collect coverage in CI (jest.preset.js) and declare
      # `coverage/{projectRoot}` as an output, so Nx hydrates each tested
      # project's report onto this runner after the distributed run. This step
      # merges them into one number (the whole workspace on a push, the affected
      # projects on a PR), writes the job summary, and — on a non-fork PR —
      # upserts a single coverage comment. `always()` so a coverage-threshold
      # failure above still produces the report.
      - name: Coverage report
        if: always()
        # Reporting only — the coverage *gate* is the `test` run above. A broken
        # reporter (or Nx not hydrating the coverage dirs) must not block a merge.
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const report = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/coverage-report.cjs`);
            await report({ github, context, core });

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/docs/features/ci-features/self-healing-ci
      - run: pnpm exec nx fix-ci
        if: always()
